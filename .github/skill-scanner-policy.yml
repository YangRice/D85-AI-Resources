policy_name: d85-balanced
policy_version: "1.0"
preset_base: balanced

# Reviewed 2026-10-17 against cisco-ai-skill-scanner 2.3.0.
# CROSS_SKILL_DATA_RELAY correlates words such as "private" or "token" in
# any skill with any urllib.request import in another skill. It does not
# establish an upload, a shared payload, or data flow between those skills.
#
# The flagged helpers are downloaders:
# - edit-svg-canvas/scripts/edit_svg.py: GET a pinned Method Draw archive;
#   SVG editing is served on 127.0.0.1 and external SVG content is rejected.
# - toastmasters-poster-maker/scripts/fetch_brand_assets.py: GET/HEAD official
#   asset URLs, including bounded range downloads; no request carries a body.
#
# Keep this correlation visible for review, but do not treat it alone as
# proven exfiltration. This is a rule-wide severity adjustment, not a scoped
# exception. LLM, static, and behavioral exfiltration findings remain subject
# to the unchanged HIGH failure gate. Revisit on scanner upgrades or changes
# to either helper's network behavior.
severity_overrides:
  - rule_id: CROSS_SKILL_DATA_RELAY
    severity: MEDIUM
    reason: >-
      Reviewed downloader-only helpers trigger an import/keyword correlation
      without evidence of data transfer between skills. Retain as a review
      warning; independently detected exfiltration still blocks the scan.
